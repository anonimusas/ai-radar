<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0b0d12; --bg2:#11141c; --card:#151925; --card2:#1b2030;
  --line:#242a3a; --tx:#e8ecf5; --tx2:#9aa4bb; --tx3:#6b7488;
  --acc:#7c5cff; --acc2:#22d3ee; --new:#34d399; --warn:#fbbf24;
  --r:16px;
}
@media (prefers-color-scheme:light){
  :root{--bg:#f6f7fb;--bg2:#ffffff;--card:#ffffff;--card2:#f0f2f8;--line:#e3e6ef;
        --tx:#111725;--tx2:#5a6379;--tx3:#8b93a7;}
}
html,body{margin:0;padding:0;background:var(--bg);color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:contain}
body{padding-bottom:calc(82px + env(safe-area-inset-bottom))}
a{color:inherit;text-decoration:none}
.wrap{max-width:760px;margin:0 auto;padding:0 14px}

/* ── header ── */
header{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.hd{display:flex;align-items:center;gap:10px;padding:12px 14px 10px;max-width:760px;margin:0 auto}
.logo{width:32px;height:32px;border-radius:10px;flex:none;
  background:linear-gradient(140deg,var(--acc),var(--acc2));display:grid;place-items:center;
  font-size:17px;box-shadow:0 4px 16px rgba(124,92,255,.35)}
h1{font-size:17px;margin:0;font-weight:700;letter-spacing:-.2px;line-height:1.15}
.sub{font-size:11px;color:var(--tx3);margin-top:2px}
.spacer{flex:1}
.iconbtn{width:36px;height:36px;border-radius:11px;border:1px solid var(--line);background:var(--card);
  color:var(--tx2);display:grid;place-items:center;font-size:15px;cursor:pointer;flex:none}
.iconbtn:active{transform:scale(.94)}

/* ── search ── */
.searchbox{padding:0 14px 10px;max-width:760px;margin:0 auto}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);
  border-radius:13px;padding:0 12px;height:42px}
.search input{flex:1;border:0;background:transparent;color:var(--tx);font-size:15px;outline:none;
  font-family:inherit;min-width:0}
.search input::placeholder{color:var(--tx3)}
.search .clr{color:var(--tx3);cursor:pointer;font-size:16px;display:none}

/* ── chips ── */
.chips{display:flex;gap:7px;overflow-x:auto;padding:0 14px 12px;max-width:760px;margin:0 auto;
  scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--tx2);
  border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;cursor:pointer;
  display:flex;align-items:center;gap:6px;white-space:nowrap;transition:.15s}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--tx3)}
.chip.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.chip.on .dot{box-shadow:0 0 0 2px color-mix(in srgb,var(--bg) 60%,transparent)}
.chip .n{font-size:11px;opacity:.6;font-weight:700}

/* ── digest ── */
.digest{margin:2px auto 14px;max-width:760px;padding:0 14px;display:none}
.digest.show{display:block}
.digest .inner{background:linear-gradient(150deg,rgba(124,92,255,.16),rgba(34,211,238,.09));
  border:1px solid rgba(124,92,255,.32);border-radius:var(--r);padding:14px 15px}
.digest h2{margin:0 0 9px;font-size:12.5px;letter-spacing:.9px;text-transform:uppercase;
  color:var(--acc2);display:flex;align-items:center;gap:7px}
.digest ul{margin:0;padding-left:17px}
.digest li{font-size:14.5px;line-height:1.5;margin-bottom:7px;color:var(--tx)}
.digest li:last-child{margin-bottom:0}
.digest b{color:#fff}
@media (prefers-color-scheme:light){.digest b{color:#0b0d12}}

/* ── list ── */
.list{max-width:760px;margin:0 auto;padding:0 14px}
.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:13px 14px;margin-bottom:9px;position:relative;overflow:hidden;
  transition:transform .12s,border-color .15s,background .15s}
.card:active{transform:scale(.985);background:var(--card2)}
.card.read{opacity:.52}
.card .bar{position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c,#666)}
.card .top{display:flex;align-items:center;gap:7px;margin-bottom:6px;flex-wrap:wrap}
.src{font-size:11px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:var(--c,#aaa)}
.time{font-size:11.5px;color:var(--tx3);margin-left:auto;white-space:nowrap}
.new-badge{font-size:9.5px;font-weight:900;letter-spacing:.6px;color:#06251a;background:var(--new);
  border-radius:5px;padding:2px 5px;text-transform:uppercase}
.card h3{margin:0;font-size:15.5px;line-height:1.36;font-weight:650;letter-spacing:-.15px}
.card p{margin:6px 0 0;font-size:13px;line-height:1.45;color:var(--tx2);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .tags{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
.tag{font-size:10.5px;color:var(--tx3);border:1px solid var(--line);border-radius:6px;padding:2px 6px}
.empty{text-align:center;color:var(--tx3);padding:60px 20px;font-size:14px;line-height:1.6}

/* ── footer / tabbar ── */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;
  background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
.tabbar .wrap2{display:flex;width:100%;max-width:760px;margin:0 auto}
.tab{flex:1;background:none;border:0;color:var(--tx3);font-family:inherit;font-size:10.5px;
  font-weight:700;padding:9px 0 10px;display:flex;flex-direction:column;align-items:center;gap:3px;
  cursor:pointer;letter-spacing:.2px}
.tab i{font-size:17px;font-style:normal;line-height:1}
.tab.on{color:var(--acc2)}
.banner{display:none;max-width:760px;margin:0 auto 10px;padding:0 14px}
.banner.show{display:block}
.banner .bi{display:flex;align-items:center;gap:9px;background:linear-gradient(150deg,rgba(251,191,36,.14),rgba(251,191,36,.06));
  border:1px solid rgba(251,191,36,.38);border-radius:13px;padding:10px 12px;font-size:12.5px;
  line-height:1.4;color:var(--tx)}
.banner .bi.blue{background:linear-gradient(150deg,rgba(34,211,238,.14),rgba(34,211,238,.05));
  border-color:rgba(34,211,238,.4)}
.banner b{font-weight:700}
.banner button{margin-left:auto;flex:none;background:var(--tx);color:var(--bg);border:0;
  border-radius:9px;padding:7px 11px;font-size:12px;font-weight:800;font-family:inherit;cursor:pointer}
.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(-20px);bottom:calc(96px + env(safe-area-inset-bottom));
  background:var(--card2);border:1px solid var(--line);color:var(--tx);padding:10px 16px;
  border-radius:12px;font-size:13px;z-index:60;opacity:0;transition:.25s;pointer-events:none;
  box-shadow:0 10px 30px rgba(0,0,0,.35);max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(min-width:761px){.tabbar{display:none}body{padding-bottom:24px}}
</style>
</head>

ch currently hosts this. My use case is the following. For a university course I want to host Qwen 27b or maybe another Qwen model…"},{"id":"https://github.com/Senora-dev/aidlc-ui","title":"Локальный пользовательский интерфейс, доступный только для чтения, для рабочих процессов AWS AI-DLC.","link":"https://github.com/Senora-dev/aidlc-ui","src":"hn","ts":1794827288,"desc":"","lang":"en","cats":[],"title_orig":"A local, read-only UI for AWS AI-DLC workflows"},{"id":"https://habr.com/ru/companies/ru_mts/articles/1108316/","title":"Сколько стоит построить дата-центр в космосе: экономика орбитального ЦОД на 13 кВт","link":"https://habr.com/ru/companies/ru_mts/articles/1108316/","src":"habr","ts":1794826844,"desc":"Дискуссия о возможности космических дата-центров сейчас крутится вокруг стоимости доставки оборудования на орбиту. Сможет ли Starship снизить её настолько, чтобы такие проекты стали экономически выгодными? Однако стоимость запуска — лишь часть затрат. Важно и то, для каких задач будет использоваться дата-центр и какие…","lang":"ru","cats":["космические дата-центры","орбитальные ЦОД","Edge AI"]},{"id":"https://habr.com/ru/companies/avito/articles/1108376/","title":"AI повсюду: зачем нужен QA, если всё может делать агент?","link":"https://habr.com/ru/companies/avito/articles/1108376/","src":"habr","ts":1794826739,"desc":"Год назад все задавались вопросом, стоит ли применять AI в тестировании? Сейчас вопрос другой: что ему доверить и как проверить, что он сделал всё правильно. Агенты и ассистенты давно живут в ежедневной рутине, и пора сверить часы. В новом выпуске «Не воспроизводится» Оля Шнайдер и Сережа Атрощенков пригласили Игоря…","lang":"ru","cats":["не воспроизводится","подкаст","avitotech"]},{"id":"https://t3_1xxmj9o","title":"[Бумага и модели] Геймер: универсальная базовая модель «видение-язык-действие» для долгосрочного игрового агента в реальном времени","link":"https://t3_1xxmj9o","src":"llama","ts":1794826730,"desc":"Мы представляем Gamer, универсальн cts. Across three models, a controlled sensitivity intervention moves hard-drop from gains of…"},{"id":"https://arxiv.org/abs/2611.17339","title":"Рейтинг сохраняется? Аудит детекторов галлюцинаций, ориентированный на практикующих специалистов, на небольших квантовых LLM, встроенных в устройство","link":"https://arxiv.org/abs/2611.17339","src":"arxiv","ts":1794805200,"desc":"arXiv:2611.17339v1 Тип объявления: новое Аннотация: В обнаружении галлюцинаций для больших языковых моделей преобладают методы, оцененные на исследовательских моделях 7B-70B с большими бюджетами выборки и метками правильности точного соответствия или ROUGE. Практикующие небольшие модели фактически поставляются на устройстве, Phi-3-mini…","lang":"en","cats":["cs.AI"],"title_orig":"Does the Ranking Hold? A Practitioner-Facing Audit of Hallucination Detectors on Small, Quantized, On-Device LLMs","desc_orig":"arXiv:2611.17339v1 Announce Type: new Abstract: Hallucination detection for large language models is dominated by methods evaluated on 7B-70B research models with abundant sampling budgets and exact-match or ROUGE correctness labels. The small models practitioners actually ship on-device, Phi-3-mini…"},{"id":"https://arxiv.org/abs/2611.17340","title":"LoRAWeaver: маршрутизация направленного адаптера в пространстве представления LoRA","link":"https://arxiv.org/abs/2611.17340","src":"arxiv","ts":1794805200,"desc":"arXiv:2611.17340v1 Объявление Тип: новое Аннотация: Обновление больших языковых моделей путем полного переобучения обходится дорого. Точная настройка с эффективным использованием параметров снижает стоимость адаптации, но повторная адаптация создает растущий пул адаптеров LoRA для конкретных задач. Этот пул усложняет выбор адаптера во время вывода…","lang":"en","cats":["cs.AI"],"title_orig":"LoRAWeaver: Directional Adapter Routing in LoRA Representation Space","desc_orig":"arXiv:2611.17340v1 Announce Type: new Abstract: Large language models are expensive to update through full retraining. Parameter-efficient fine-tuning reduces the cost of adaptation, but repeated adaptation creates a growing pool of task-specific LoRA adapters. This pool complicates adapter selection during inference…"},{"id":"https://arxiv.org/abs/2611.17341","title":"Табличные априорные данные популяции как структурированный поиск для прогнозирования набора лекарств EHR","link":"https://arxiv.org/abs/2611.17341","src":"arxiv","ts":1794805200,"desc":"arXiv:2611.17341v1 Тип объявления: новый Аннотация: Прогнозирование приема лекарств на основе электронных медицинских записей представляет собой проблему структурированного прогнозирования с фиксированным словарем, однако последние клинические системы RAG часто рассматривают ее как рассуждение на основе открытого случая: извлекают аналогичные данные о госпитализации пациентов и просят LLM сделать вывод о наборе лекарств…","lang":"en","cats":["cs.AI"],"title_orig":"Tabular Population Priors as Structured Retrieval for EHR Medication Set Prediction","desc_orig":"arXiv:2611.17341v1 Announce Type: new Abstract: Medication prediction from electronic health records is a fixed vocabulary structured prediction problem, yet recent clinical RAG systems often treat it like open ended case based reasoning: retrieve similar patient admissions and ask an LLM to infer a medication set…"},{"id":"https://arxiv.org/abs/2611.17495","title":"Использование непрозрачной последовательной глубины","link":"https://arxiv.org/abs/2611.17495","src":"arxiv","ts":1794805200,"desc":"arXiv:2611.17495v1 Тип объявления: новый Аннотация: Цепочка мыслей (CoT) в настоящее время является ценным инструментом для наблюдения за моделями ИИ, но некоторые архитектурные изменения могут значительно снизить контролируемость CoT. Мы вводим в действие показатель, который служит показателем объема невербализованного серийного познания, которое модель может…","lang":"en","cats":["cs.AI","cs.LG"],"title_orig":"An Operationalization of Opaque Serial Depth","desc_orig":"arXiv:2611.17 ain: Framing Effects and Internal State Interventions on Collusive Behavior in a Long-Horizon LLM Agent","desc_orig":"arXiv:2611.17515v1 Announce Type: new Abstract: Can sustained gain-loss (valence) framing sway an LLM agent toward market manipulation? We place Gemma 3 12B into the seat of a defendant in the London silver-fixing litigation, in a market simulation built from real case transcripts. Across 260 simulations, the agent is…"},{"id":"https://arxiv.org/abs/2611.17524","title":"Отжиг модели: эффективное обучение на основе анализа и консолидации данных","link":"https://arxiv.org/abs/2611.17524","src":"arxiv","ts":1794805200,"desc":"arXiv:2611.17524v1 Тип объявления: новое Аннотация: Небольшой набор размеченных данных запоминается задолго до того, как исчерпается бюджет на обучение, а горячие метки, которые еще предстоит установить, в основном повышают уверенность. Модельный отжиг тратит остальную часть бюджета на обзор и консолидацию, переучивая собственные данные сети…","lang":"en","cats":["cs.AI","cs.LG"],"title_orig":"Model Annealing: Data-Efficient Learning through Review and Consolidation","desc_orig":"arXiv:2611.17524v1 Announce Type: new Abstract: A small labelled dataset is memorized long before the training budget runs out, and the one-hot labels that remain to be fitted then mostly sharpen confidence. Model annealing spends the rest of the budget on review and consolidation, relearning from the network's own…"},{"id":"https://arxiv.org/abs/2611.17532","title":"Биокомпьютинг астроцитов: вклад астроцитов в вычисления нейронных сетей","link":"https://arxiv.org/abs/2611.17532","src":"arxiv","ts":1794805200,"desc":"arXiv:2611.17532v1 Тип объявления: новое Аннотация: Дирижеры имеют решающее значение для работы оркестра, даже если они не издают звука. Фундаментальные исследования и клинические исследования последнего десятилетия показывают, что астроциты могут быть «дирижерами» «оркестра», то есть сети мозга: астроциты составляют…","lang":"en","cats":["cs.AI","physics.bio-ph","q-bio.NC"],"title_orig":"Astrocyte Biocomputing: Astrocytic Contributions to Neural Network Computation","desc_orig":"arXiv:2611.17532v1 Announce Type: new Abstract: Conductors are critical for the performance of an orchestra even though they do not emit sound. Basic research and clinical studies in the last decade are revealing that astrocytes may be the \"conductors\" of the \"orchestra\" that is the brain network: astrocytes make up…"},{"id":"https://arxiv.org/abs/2611.17539","title":"Поддающийся проверке pXRD: определение структуры pXRD при восхождении на холм с помощью агентов LLM","link":"https://arxiv.org/abs/2611.17539","src":"arxiv","ts":1794805200,"desc":"arXiv:2611.17539v1 Тип объявления: новое Аннотация: Автономное определение кристаллической структуры методом порошковой рентгеновской дифракции (pXRD) остается ключевым узким местом в лабораториях самодвижущихся материалов. Мы формулируем задачу определения структуры pXRD как проверяемую агентную задачу поиска: структуры-кандидаты могут быть…","lang":"en","cats":["cs.AI"],"title_orig":"Verifiable pXRD: Hill-climbing pXRD structure determination with LLM agents","desc_orig":"arXiv:2611.17539v1 Announce Type: new Abstract: Autonomous crystal-structure determination from powder X-ray diffraction (pXRD) remains a key bottleneck for self-driving materials laboratories. We formulate the task of pXRD structure determination as a verifiable agentic search problem: candidate structures can be…"},{"id":"https://arxiv.org/abs/2611.17564","title":"AI-Voyager: система общественных интересов для гражданского рассуждения человека и ИИ, позволяющая оспаривать и формировать правила, регулирующие ИИ","link":"https://arxiv.org/abs/2611.17564","src":"arxiv","ts":1794805200,"desc":"arXiv:2611.17564v1 Тип объявления: новый Аннотация: Правительства пишут правила для искусственного интеллекта, которые решают, что считать автоматическим решением или вредом, часто до того, как люди, на которых они влияют, смогут задать им вопросы. Мы представляем AI-Voyager, систему общественных интересов для гражданского мышления человека и ИИ, в…","lang":"en","cats":["cs.AI","cs.CL","cs.HC"],"title_orig":"AI-Voyager: A Public-Interest System for Human-AI Civic Reasoning to Contest and Shape the Rules That Govern AI","desc_orig":"arXiv:2611.17564v1 Announce Type: new Abstract: Governments are writing rules for artificial intelligence that decide what counts as an automated decision or a harm, often before the people they affect have a chance to question them. We introduce AI-Voyager, a public-interest system for human-AI civic reasoning, in…"},{"id":"https://arxiv.org/abs/2611.17583","title":"Когда меньше информации приносит пользу? Точный конечный атлас представительства, выигрыша и затрат","link":"https://arxiv.org/abs/2611.17583","src":"arxiv","ts":1794805200,"desc":"arXiv:2611.17583v1 Тип объявления: новое Аннотация: Представление, сохраняющее один бит о мире с четырьмя состояниями, может идеально решить задачу, в то время как другое, сохраняющее в среднем 1,5 бита, достигает точности только 75%. Разница заключается в том, какие различия сохраняет каждое представление. Мы исследуем эту взаимосвязь в…","lang":"en","cats":["cs.AI"],"title_orig":"When Does Less Information Pay? An Exact Finite Atlas of Representation, Payoff, and Cost","desc_orig":"arXiv:2611.17583v1 Announce Type: new Abstract: A representation that retains one bit about a four-state world can solve a task perfectly, while another that retains 1.5 bits on average reaches only 75% accuracy. The difference lies in which distinctions each representation preserves. We examine this relationship in a…"},{"id":"https://t3_1xxgcjo","title":"Совершенно УДИВИТЕЛЬНО!!","link":"https://t3_1xxgcjo","src":"r_claude","ts":1794804017,"desc":"Мой друг сказал мне, что мне следует использовать Клода, чтобы попытаться решить конкретную проблему, связанную с моим бизнесом на eBay. Это было 7 месяцев назад. Я никогда не осознавал, насколько ИИ может изменить мою жизнь. Я пробовал использовать ИИ для чатов на Гроке и Близнецах, но никогда не использовал его для чего-то полезного. Теперь я только что выпустил свой Saas для других…","lang":"en","cats":[],"title_orig":"Absolutely AMAZING!!","desc_orig":"A friend of mine told me that I should use Claude to try and solve a specific problem with my eBay business. That was 7 months ago. I never realized how much AI could change my life. I had dabbled with AI for chats on grok and Gemini, but I had never used it for anything useful. Now, I just released my Saas for other…"},{"id":"https://tag:github.com,2008:Repository/599547518/v0.34.0","title":"v0.34.0","link":"https://tag:github.com,2008:Repository/599547518/v0.34.0","src":"rel_vllm","ts":1794803235,"desc":"v0.34.0","lang":"en","cats":[],"title_orig":"v0.34.0","desc_orig":"v0.34.0"},{"id":"https://www.theverge.com/tech/1033999/jensen-huang-return-nvidia-megaspeed","title":"Дженсен Хуанг, возможно, готовит возвращение и продолжение последней драмы Nvidia","link":"https://www.theverge.com/tech/1033999/jensen-huang-return-nvidia-megaspeed","src":"verge","ts":1794802625,"desc":"Драма вокруг соучредителя и бывшего генерального директора Nvidia Дженсена Хуанга развивается быстро. Последний выпуск нашего информационного бюллетеня Stepback должен ввести вас в курс дела, но с сегодняшнего утра уже произошел ряд новых событий. Сюда входят слухи о том, что Дженсен Хуанг, возможно, пытается найти путь обратно на пост генерального директора…","lang":"en","cats":[],"title_orig":"Jensen Huang might be plotting a return and more of the latest Nvidia drama","desc_orig":"The drama around Nvidia co-founder and former CEO Jensen Huang is evolving quickly. The latest edition of our Stepback newsletter should get you up to speed, but there have already been a number of new developments since this morning. That includes rumors that Jensen Huang might be trying to find a path back to CEO…"},{"id":"https://t3_1xxdzcf","title":"An cats":[],"title_orig":"Apple’s new study looks to improve the effectiveness of AI health tools","desc_orig":"Apple announced a new study today with the goal of better understanding how people interact with conversational AI health tools and how useful their responses actually are. The company is conducting the Apple Health AI Usage Study in collaboration with OpenEvidence, a clinical AI platform used by healthcare…"},{"id":"https://t3_1xxcwp5","title":"Что произойдет, если Anthropic окажется в долгу перед акционерами?","link":"https://t3_1xxcwp5","src":"r_claude","ts":1794793374,"desc":"Клод невероятен. Это стало бесценным для меня и моей организации. Настоящая технология, меняющая жизнь. Прямо сейчас кажется, что ценность того, что мы получаем, невероятна. Но... Что происходит, когда речь идет о ежедневном получении большей прибыли, чтобы накормить голодные рты акционеров? Я чувствую страх, зная, что это вот-вот…","lang":"en","cats":[],"title_orig":"What happens when Anthropic is beholden to shareholders?","desc_orig":"Claude is incredible. It has become invaluable to me and my organization. True life altering tech. Right now it feels like the value for what we get is incredible. But… What happens when it is all about generating more profit every day to feed the hungry mouths of shareholders? I feel dread knowing this is about to…"},{"id":"https://t3_1xxcq3g","title":"Я как пещерный человек, обнаруживающий огонь вместе с Клодом.","link":"https://t3_1xxcq3g","src":"r_claude","ts":1794792840,"desc":"Я использовал Chatgpt с момента его первого появления. И я думаю, что преимущество первопроходца и ошибка невозвратных издержек заставили меня остаться. Я использовал его с первых дней, когда LLM было отстойным, но через много лет я почувствовал, что он усвоил то, что мне нравится, и делал то, что я хотел, в 90% случаев. Друг убедил меня попробовать Клода и…","lang":"en","cats":[],"title_orig":"I'm like a caveman discovering fire with Claude.","desc_orig":"I used Chatgpt "desc_orig":"The King’s Trust and OpenAI launch a £1m partnership to help up to 25,000 young people across the UK build practical AI skills for work."},{"id":"https://simonwillison.net/2026/Nov/15/datasette-maplibre/","title":"набор данных-maplibre 0.1a0","link":"https://simonwillison.net/2026/Nov/15/datasette-maplibre/","src":"simon","ts":1794787116,"desc":"Релиз: datasette-maplibre 0.1a0 Первый новый геопространственный плагин Datasette за долгое время! Этот сочетает в себе превосходную библиотеку MapLibre GL с OpenFreeMap, бесплатным сервером векторных карт, которым управляет Zsolt Ero (вам следует спонсировать Zsolt на GitHub). Большую часть этого я создал с помощью одного приглашения к Claude Fable 5.2…","lang":"en","cats":[],"title_orig":"datasette-maplibre 0.1a0","desc_orig":"Release: datasette-maplibre 0.1a0 The first new Datasette geospatial plugin in quite a while! This one combines the excellent MapLibre GL library with OpenFreeMap , the free vector map server operated by Zsolt Ero (you should sponsor Zsolt on GitHub .) I built most of this with a single prompt to Claude Fable 5.2…"},{"id":"https://techcrunch.com/2026/11/15/indian-chip-startup-bharat-semi-lands-24m-seed-round-as-it-eyes-global-ai-sensor-market/","title":"Индийский стартап по производству чипов Bharat Semi получил посевной раунд стоимостью 24 миллиона долларов, ориентируясь на глобальный рынок датчиков искусственного интеллекта","link":"https://techcrunch.com/2026/11/15/indian-chip-startup-bharat-semi-lands-24m-seed-round-as-it-eyes-global-ai-sensor-market/","src":"tc","ts":1794785400,"desc":"Bharat Semi заявляет, что добилась побед в разработке своей сенсорной технологии с поддержкой искусственного интеллекта среди таких компаний, как General Atomics.","lang":"en","cats":["Startups","AI","Info edge"],"title_orig":"Indian chip startup Bharat Semi lands $24M seed round as it eyes global AI sensor market","desc_orig":"Bharat Semi says it has secured design wins for its AI-enabled sensor technology with companies including General Atomics."},{"id":"https://simonwillison.net/2026/Nov/15/datasette/","title":"набор данных 1.0a43","link":"https://simonwillison.net/2026/Nov/15/datasette/","src":"simon","ts":1794784827,"desc":"Релиз: набор данных 1.0a43 Я усердно опирался на Claude Fable 5.2, чтобы помочь ускорить этап 1.0, который сейчас завершен на 53%. Самым важным элементом версии 1.0 в этом выпуске является поддержка потоковой передачи для средств рендеринга вывода — встроенные механизмы экспорта TSV и CSV теперь также используют это, а плагины могут регистрировать…","lang":"en","cats":[],"title_orig":"datasette 1.0a43","desc_orig":"Release: datasette 1.0a43 I've been leaning hard into Claude Fable 5.2 to help knock things off the 1.0 milestone , which is now 53% complete. The biggest 1.0 item in this release is streaming support for output renderers - the built-in TSV and CSV export mechanisms now use this as well, and plugins can register…"},{"id":"https://simonwillison.net/2026/Nov/15/datasette-2/","title":"набор данных 0.65.6","link":"https://simonwillison.net/2026/Nov/15/datasette-2/","src":"simon","ts":1794784697,"desc":"Релиз: набор данных 0.65.6 Я перенес небольшое исправление безопасности из версии 1.0a43: исправлена ​​проблема безопасности, из-за которой база данных, зарегистрированная с помощью add_database(db, name=...,route=...) с маршрутом, отличным от ее имени, могла быть загружена из /<route>.db субъектами, которым было отказано в доступе к ней. [...] Теги: безопасность, набор данных","lang":"en","cats":[],"title_orig":"datasette 0.65.6","desc_orig":"Release: datasette 0.65.6 I backported a minor security fix from 1.0a43: Fixed a security issue where a database registered using add_database(db, name=..., route=...) with a route that differs from its name could be downloaded from /<route>.db by actors who were denied access to it. [...] Tags: security , datasette"},{"id":"https://openai.com/index/step-toward-defining-the-standard-model","title":"Шаг к определению Стандартной модели на решетке","link":"https://openai.com/index/step-toward-defining-the-standard-model","src":"openai","ts":1794780001,"desc":"Изучите возможное определение Стандартной модели на непертурбативной решетке и то, как GPT-6 Astra помогла превратить эту идею в подробное доказательство.","lang":"en","cats":["Science"],"title_orig":"A step toward defining the Standard Model on a lattice","desc_orig":"Explore a candidate nonperturbative lattice definition of the Standard Model and how GPT-6 Astra helped turn the idea into a detailed proof."},{"id":"https://openai.com/index/our-new-blog-for-science","title":"Наш новый блог о науке","link":"https://openai.com/index/our-new-blog-for-science","src":"openai","ts":1794780000,"desc":"Научный блог OpenAI делится новыми открытиями, практическими методами и рассказами из первых рук исследователей, использующих ИИ для продвижения научных открытий.","lang":"en","cats":["Science"],"title_orig":"Our new blog for science","desc_orig":"The OpenAI science blog shares new findings, practical methods, and firsthand accounts from researchers using AI to advance scientific discovery."},{"id":"https://techcrunch.com/2026/11/15/is-bad-news-for-jensen-huang-also-bad-news-for-the-ai-industry/","title":"Являются ли плохие новости для Дженсена Хуанга также плохими новостями для индустрии искусственного интеллекта?","link":"https://techcrunch.com/2026/11/15/is-bad-news-for-jensen-huang-also-bad-news-for-the-ai-industry/","src":"tc","ts":1794779795,"desc":"«Дженсен — это Nvidia, верно? И большая часть этой экономики держится на Nvidia».","lang":"en","cats":["AI","Government & Policy","Equity podcast"],"title_orig":"Is bad news for Jensen Huang also bad news for the AI industry?","desc_orig":"\"Jensen is Nvidia, right? And so much of this economy is riding on Nvidia.\""},{"id":"https://t3_1xx7qbf","title":"Я создал инструмент для наблюдения за тем, что происходит внутри LLM. Также позволяет сравнивать два кванто , "r_claude": {"name": "r/ClaudeAI", "color": "#d97757", "lang": "en"}, "r_openai": {"name": "r/OpenAI", "color": "#ff5700", "lang": "en"}, "rel_ollama": {"name": "Ollama релизы", "color": "#9e9e9e", "lang": "en"}, "rel_vllm": {"name": "vLLM релизы", "color": "#30a2ff", "lang": "en"}, "rel_comfy": {"name": "ComfyUI релизы", "color": "#b388ff", "lang": "en"}};
const DIGEST = "<ul><li><b>Hacker News AI</b> — HN: Guru – саморазвивающаяся платформа искусственного интеллекта с открытым исходным кодом, не подвергающаяся цензуре и ориентированная на конфиденциальность.</li><li><b>Hacker News AI</b> — Linux Foundation — служба имен агентов, обеспечивающая проверяемую личность агентам ИИ</li><li><b>Habr AI</b> — Локальная LLM для кодинга в 2026: Mellum, OpenCode и AI-агенты прямо в IDE</li><li><b>TechCrunch AI</b> — Выпускники Freshworks собрали 53 миллиона долларов для борьбы с Salesforce и HubSpot с помощью CRM на базе искусственного интеллекта</li><li><b>Hacker News AI</b> — ИИ убил MVP – да здравствует IUP</li></ul>";
const DIGESTLABEL = "без LLM (только заголовки)";
const GENERATED = "2026-11-16T12:58:52+00:00";

const LS_READ = 'airadar.read.v1', LS_SAVED = 'airadar.saved.v1', LS_SEEN = 'airadar.seen.v1';
const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d } catch(e){ return d } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)) } catch(e){} };

let readSet  = new Set(load(LS_READ, []));
let savedSet = new Set(load(LS_SAVED, []));
let seenSet  = new Set(load(LS_SEEN, []));   // id, которые уже показывались → «новое» считается один раз
let filter = 'all', query = '';

DATA.forEach(it => { it._t = it.ts ? it.ts * 1000 : 0; });

/* ── «новое»: id, которых не было в прошлый визит ── */
const firstRun = seenSet.size === 0;
const freshIds = new Set(DATA.filter(i => !seenSet.has(i.id)).map(i => i.id));
DATA.forEach(i => seenSet.add(i.id));
save(LS_SEEN, [...seenSet]);
const isFresh = id => !firstRun && freshIds.has(id) && !readSet.has(id);

/* ── helpers ── */
function ago(ts){
  if(!ts) return 'без даты';
  const s = Math.floor((Date.now() - ts)/1000);
  if(s < 60) return 'только что';
  if(s < 3600) return Math.floor(s/60) + ' мин';
  if(s < 86400) return Math.floor(s/3600) + ' ч';
  if(s < 86400*7) return Math.floor(s/86400) + ' дн';
  const d = new Date(ts);
  return d.toLocaleDateString('ru-RU', {day:'numeric', month:'short'});
}
function esc(s){ return (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])) }

let toastT;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove('show'), 1900);
}

/* ── chips ── */
const counts = {};
DATA.forEach(i => counts[i.src] = (counts[i.src]||0) + 1);
function buildChips(){
  const box = document.getElementById('chips');
  const mk = (key, label, color, n) =>
    `<button class="chip${filter===key?' on':''}" data-f="${key}">
       ${color?`<span class="dot" style="background:${color}"></span>`:''}${esc(label)}
       <span class="n">${n}</span></button>`;
  let h = mk('all', 'Всё', '', DATA.length);
  Object.entries(SOURCES).forEach(([k, s]) => { if(counts[k]) h += mk(k, s.name, s.color, counts[k]); });
  box.innerHTML = h;
  box.querySelectorAll('.chip').forEach(c => c.onclick = () => {
    filter = c.dataset.f; buildChips(); render();
  });
}

/* ── render ── */
function visible(){
  const q = query.trim().toLowerCase();
  return ORDERED.filter(it => {
    if(filter === 'saved'){ if(!savedSet.has(it.id)) return false; }
    else if(filter === 'unread'){ if(readSet.has(it.id)) return false; }
    else if(filter === 'ru'){ if(it.lang !== 'ru') return false; }
    else if(filter !== 'all'){ if(it.src !== filter) return false; }
    if(q && ![it.title, it.desc, it.title_orig, it.desc_orig].some(t => (t||'').toLowerCase().includes(q))) return false;
    return true;
  });
}

/* Не даём одному источнику занять весь верх: после сортировки по времени
   разбавляем «лесенку» — не больше 2 подряд из одного источника в первых 40 */
function interleave(arr, windowSize = 6, maxRun = 2){
  const out = [], rest = arr.slice();
  let runSrc = null, runLen = 0;
  while (rest.length) {
    let idx = 0;
    if (runLen >= maxRun) {
      const alt = rest.findIndex((x, i) => x.src !== runSrc && i < windowSize);
      if (alt > -1) idx = alt;
    }
    const [pick] = rest.splice(idx, 1);
    runSrc = pick.src === runSrc ? runSrc : pick.src;
    runLen = pick.src === runSrc ? runLen + 1 : 1;
    if (pick.src !== runSrc) runLen = 1;
    out.push(pick);
  }
  return out;
}
const ORDERED = interleave(DATA.slice().sort((a, b) => b._t - a._t));

function render(){
  const list = document.getElementById('list');
  const items = visible();
  const unread = DATA.filter(i => !readSet.has(i.id)).length;
  document.getElementById('stat').textContent =
    `${DATA.length} материалов · ${Object.keys(SOURCES).filter(k=>counts[k]).length} источников · ${unread} новых`;

  if(!items.length){
    list.innerHTML = `<div class="empty">Ничего не найдено.<br>Попробуй другой фильтр или запрос.</div>`;
    return;
  }
  list.innerHTML = items.map(it => {
    const s = SOURCES[it.src] || {name:it.src, color:'#777'};
    const tags = (it.cats||[]).slice(0,3).map(c=>`<span class="tag">${esc(c)}</span>`).join('');
    return `<a class="card${readSet.has(it.id)?' read':''}" href="${esc(it.link)}" target="_blank"
              rel="noopener" data-id="${esc(it.id)}" style="--c:${s.color}">
      <div class="bar"></div>
      <div class="top">
        <span class="src">${esc(s.name)}</span>
        ${isFresh(it.id)?'<span class="new-badge">new</span>':''}
        ${savedSet.has(it.id)?'<span style="color:var(--warn);font-size:12px">★</span>':''}
        <span class="time">${ago(it._t)}</span>
      </div>
      <h3>${esc(it.title)}</h3>
      ${it.desc?`<p>${esc(it.desc)}</p>`:''}
      ${tags?`<div class="tags">${tags}</div>`:''}
    </a>`;
  }).join('');

  list.querySelectorAll('.card').forEach(card => {
    card.addEventListener('click', () => {
      readSet.add(card.dataset.id);
      save(LS_READ, [...readSet]);
      card.classList.add('read');
      card.querySelector('.new-badge')?.remove();
      setTimeout(render, 350);
    });
    /* долгий тап = в избранное */
    let lt;
    card.addEventListener('touchstart', () => {
      lt = setTimeout(() => {
        const id = card.dataset.id;
        if(savedSet.has(id)) savedSet.delete(id); else savedSet.add(id);
        save(LS_SAVED, [...savedSet]);
        toast(savedSet.has(id) ? '★ Добавлено в избранное' : 'Убрано из избранного');
        navigator.vibrate?.(18);
        render();
      }, 480);
    }, {passive:true});
    ['touchend','touchmove','touchcancel'].forEach(ev =>
      card.addEventListener(ev, () => clearTimeout(lt), {passive:true}));
    card.addEventListener('contextmenu', e => e.preventDefault());
  });
}

/* ── init ── */
document.getElementById('q').addEventListener('input', e => {
  query = e.target.value;
  document.getElementById('clr').style.display = query ? 'block' : 'none';
  render();
});
document.getElementById('clr').onclick = () => {
  document.getElementById('q').value = ''; query = '';
  document.getElementById('clr').style.display='none'; render();
};
document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('on'));
  t.classList.add('on'); filter = t.dataset.tab;
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));
  buildChips(); render(); window.scrollTo({top:0,behavior:'smooth'});
});
document.getElementById('btnRefresh').onclick = () => {
  if(location.protocol === 'file:'){
    toast('Это офлайн-копия. Обнови её через GitHub Actions или пересобери build.py');
  } else {
    toast('Обновляю…'); setTimeout(()=>location.reload(), 400);
  }
};

if(DIGEST){
  document.getElementById('digestBody').innerHTML = DIGEST;
  document.getElementById('digest').classList.add('show');
  const d = new Date(GENERATED);
  document.getElementById('digestLabel').textContent =

}

/* ── дата сборки + офлайн-режим ── */
const buildDate = new Date(GENERATED);
const buildStr = buildDate.toLocaleString('ru-RU', {day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
document.getElementById('stat').textContent += ' · ' + buildStr;

function banner(html, kind){
  const b = document.getElementById('banner'), i = document.getElementById('bannerInner');
  i.className = 'bi' + (kind === 'blue' ? ' blue' : '');
  i.innerHTML = html;
  b.classList.add('show');
}
function offlineBanner(){
  banner(`📴 <span><b>Офлайн-режим.</b> Показаны новости, вшитые в файл при сборке
    (${buildStr}). Новые появятся, когда файл пересоберётся и ты откроешь его с интернетом.</span>`);
}
window.addEventListener('offline', offlineBanner);
if(!navigator.onLine) offlineBanner();

/* ── автообновление: одна перезагрузка на версию, без циклов ─────────────────
   1. сравниваем свою дату сборки с version.json на сервере (cache: no-store)
   2. если на сервере новее и мы за эту версию ещё не перезагружались — reload
   3. если после reload всё равно старая (CDN отдаёт кэш) — показываем кнопку
   Состояние живёт в sessionStorage: закрыл вкладку → счётчик сбросился.        */
if(location.protocol.startsWith('http')){
  const K = 'airadar.autoreload';
  const st = (() => { try { return JSON.parse(sessionStorage.getItem(K)) || {} } catch(e){ return {} } })();
  const stamp = v => new Date(v).toLocaleString('ru-RU',
    {day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});

  fetch('version.json?t=' + Date.now(), {cache:'no-store'})
    .then(r => r.ok ? r.json() : null)
    .then(v => {
      if(!v || !v.generated) return;
      const serverDate = new Date(v.generated);
      if(serverDate <= buildDate) {           // мы уже на свежей версии
        try { sessionStorage.removeItem(K) } catch(e){}
        return;
      }
      // на сервере новее
      if(st.for !== v.generated && !st.done){
        try {
          sessionStorage.setItem(K, JSON.stringify({for: v.generated, done: true}));
        } catch(e){}
        document.documentElement.style.opacity = '.6';   // мягкий переход
        location.reload();
        return;
      }
      // перезагрузились, но сервер всё ещё отдаёт кэш → предлагаем кнопку
      banner(`🔄 <span><b>Есть свежая версия</b> (${stamp(v.generated)}).</span>
        <button onclick="location.reload()">Обновить</button>`, 'blue');
    })
    .catch(() => {});
}

/* обновились с открытой вкладкой — раз в сессию подхватываем новую версию */
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible' && navigator.onLine &&
     location.protocol.startsWith('http')){
    fetch('version.json?t=' + Date.now(), {cache:'no-store'})
      .then(r => r.ok ? r.json() : null)
      .then(v => {
        if(v?.generated && new Date(v.generated) > buildDate){
          let st = {};
          try { st = JSON.parse(sessionStorage.getItem('airadar.autoreload')) || {} } catch(e){}
          if(st.for !== v.generated){ location.reload(); }
        }
      })
      .catch(() => {});
  }
});
buildChips(); render();

/* PWA: тихая регистрация service worker */
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
