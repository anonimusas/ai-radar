<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0b0d12; --bg2:#11141c; --card:#151925; --card2:#1b2030;
  --line:#242a3a; --tx:#e8ecf5; --tx2:#9aa4bb; --tx3:#6b7488;
  --acc:#7c5cff; --acc2:#22d3ee; --new:#34d399; --warn:#fbbf24;
  --r:16px;
}
@media (prefers-color-scheme:light){
  :root{--bg:#f6f7fb;--bg2:#ffffff;--card:#ffffff;--card2:#f0f2f8;--line:#e3e6ef;
        --tx:#111725;--tx2:#5a6379;--tx3:#8b93a7;}
}
html,body{margin:0;padding:0;background:var(--bg);color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:contain}
body{padding-bottom:calc(82px + env(safe-area-inset-bottom))}
a{color:inherit;text-decoration:none}
.wrap{max-width:760px;margin:0 auto;padding:0 14px}

/* ── header ── */
header{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.hd{display:flex;align-items:center;gap:10px;padding:12px 14px 10px;max-width:760px;margin:0 auto}
.logo{width:32px;height:32px;border-radius:10px;flex:none;
  background:linear-gradient(140deg,var(--acc),var(--acc2));display:grid;place-items:center;
  font-size:17px;box-shadow:0 4px 16px rgba(124,92,255,.35)}
h1{font-size:17px;margin:0;font-weight:700;letter-spacing:-.2px;line-height:1.15}
.sub{font-size:11px;color:var(--tx3);margin-top:2px}
.spacer{flex:1}
.iconbtn{width:36px;height:36px;border-radius:11px;border:1px solid var(--line);background:var(--card);
  color:var(--tx2);display:grid;place-items:center;font-size:15px;cursor:pointer;flex:none}
.iconbtn:active{transform:scale(.94)}

/* ── search ── */
.searchbox{padding:0 14px 10px;max-width:760px;margin:0 auto}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);
  border-radius:13px;padding:0 12px;height:42px}
.search input{flex:1;border:0;background:transparent;color:var(--tx);font-size:15px;outline:none;
  font-family:inherit;min-width:0}
.search input::placeholder{color:var(--tx3)}
.search .clr{color:var(--tx3);cursor:pointer;font-size:16px;display:none}

/* ── chips ── */
.chips{display:flex;gap:7px;overflow-x:auto;padding:0 14px 12px;max-width:760px;margin:0 auto;
  scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--tx2);
  border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;cursor:pointer;
  display:flex;align-items:center;gap:6px;white-space:nowrap;transition:.15s}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--tx3)}
.chip.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.chip.on .dot{box-shadow:0 0 0 2px color-mix(in srgb,var(--bg) 60%,transparent)}
.chip .n{font-size:11px;opacity:.6;font-weight:700}

/* ── digest ── */
.digest{margin:2px auto 14px;max-width:760px;padding:0 14px;display:none}
.digest.show{display:block}
.digest .inner{background:linear-gradient(150deg,rgba(124,92,255,.16),rgba(34,211,238,.09));
  border:1px solid rgba(124,92,255,.32);border-radius:var(--r);padding:14px 15px}
.digest h2{margin:0 0 9px;font-size:12.5px;letter-spacing:.9px;text-transform:uppercase;
  color:var(--acc2);display:flex;align-items:center;gap:7px}
.digest ul{margin:0;padding-left:17px}
.digest li{font-size:14.5px;line-height:1.5;margin-bottom:7px;color:var(--tx)}
.digest li:last-child{margin-bottom:0}
.digest b{color:#fff}
@media (prefers-color-scheme:light){.digest b{color:#0b0d12}}

/* ── list ── */
.list{max-width:760px;margin:0 auto;padding:0 14px}
.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:13px 14px;margin-bottom:9px;position:relative;overflow:hidden;
  transition:transform .12s,border-color .15s,background .15s}
.card:active{transform:scale(.985);background:var(--card2)}
.card.read{opacity:.52}
.card .bar{position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c,#666)}
.card .top{display:flex;align-items:center;gap:7px;margin-bottom:6px;flex-wrap:wrap}
.src{font-size:11px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:var(--c,#aaa)}
.time{font-size:11.5px;color:var(--tx3);margin-left:auto;white-space:nowrap}
.new-badge{font-size:9.5px;font-weight:900;letter-spacing:.6px;color:#06251a;background:var(--new);
  border-radius:5px;padding:2px 5px;text-transform:uppercase}
.card h3{margin:0;font-size:15.5px;line-height:1.36;font-weight:650;letter-spacing:-.15px}
.card p{margin:6px 0 0;font-size:13px;line-height:1.45;color:var(--tx2);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .tags{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
.tag{font-size:10.5px;color:var(--tx3);border:1px solid var(--line);border-radius:6px;padding:2px 6px}
.empty{text-align:center;color:var(--tx3);padding:60px 20px;font-size:14px;line-height:1.6}

/* ── footer / tabbar ── */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;
  background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
.tabbar .wrap2{display:flex;width:100%;max-width:760px;margin:0 auto}
.tab{flex:1;background:none;border:0;color:var(--tx3);font-family:inherit;font-size:10.5px;
  font-weight:700;padding:9px 0 10px;display:flex;flex-direction:column;align-items:center;gap:3px;
  cursor:pointer;letter-spacing:.2px}
.tab i{font-size:17px;font-style:normal;line-height:1}
.tab.on{color:var(--acc2)}
.banner{display:none;max-width:760px;margin:0 auto 10px;padding:0 14px}
.banner.show{display:block}
.banner .bi{display:flex;align-items:center;gap:9px;background:linear-gradient(150deg,rgba(251,191,36,.14),rgba(251,191,36,.06));
  border:1px solid rgba(251,191,36,.38);border-radius:13px;padding:10px 12px;font-size:12.5px;
  line-height:1.4;color:var(--tx)}
.banner .bi.blue{background:linear-gradient(150deg,rgba(34,211,238,.14),rgba(34,211,238,.05));
  border-color:rgba(34,211,238,.4)}
.banner b{font-weight:700}
.banner button{margin-left:auto;flex:none;background:var(--tx);color:var(--bg);border:0;
  border-radius:9px;padding:7px 11px;font-size:12px;font-weight:800;font-family:inherit;cursor:pointer}
.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(-20px);bottom:calc(96px + env(safe-area-inset-bottom));
  background:var(--card2);border:1px solid var(--line);color:var(--tx);padding:10px 16px;
  border-radius:12px;font-size:13px;z-index:60;opacity:0;transition:.25s;pointer-events:none;
  box-shadow:0 10px 30px rgba(0,0,0,.35);max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(min-width:761px){.tabbar{display:none}body{padding-bottom:24px}}
</style>
</head>

const DATA = [{"id":"https://t.me/data_secrets/10343","title":"Папа Римский заявил, что он против того, чтобы ИИ помог человечеству победить старение и смерть","link":"https://t.me/data_secrets/10343","src":"tg_datasec","ts":1794743101,"desc":"Буквально несколько дней назад в соцсетях завирусилось видео, в котором Дарио Амодеи заявляет: скачки в развитии Claude и ИИ в целом настолько велики, что рак, Альцгеймер, болезни сердца и психические расстройства могут полностью уйти в прошлое менее чем через десять лет, а продолжительность жизни может увеличиться до…","lang":"ru","cats":[]},{"id":"https://the-decoder.com/firm-linked-to-jensen-huangs-ex-lover-reportedly-brokered-nearly-12-billion-in-nvidia-chip-orders-for-china/","title":"Фирма, связанная с бывшим любовником Дженсена Хуана, как сообщается, выступила посредником в заказах чипов Nvidia для Китая на сумму почти 12 миллиардов долларов.","link":"https://the-decoder.com/firm-linked-to-jensen-huangs-ex-lover-reportedly-brokered-nearly-12-billion-in-nvidia-chip-orders-for-china/","src":"decoder","ts":1794742512,"desc":"По данным WSJ, компания Megaspeed, принадлежащая бывшей любовнице свергнутого генерального директора Nvidia Дженсена Хуанга Элис Хуанг, организовала заказы на чипы Nvidia для китайских компаний на сумму почти 12 миллиардов долларов в период с 2024 по 2025 год. По оценкам компании Culper Research, фактическая доля доходов Nvidia в Китае превышает 20 процентов, что намного превышает…","lang":"en","cats":["AI in practice","Artificial Intelligence","Short News"],"title_orig":"Firm linked to Jensen Huang's ex-lover reportedly brokered nearly $12 billion in Nvidia chip orders for China","desc_orig":"Megaspeed, the firm owned by ousted Nvidia CEO Jensen Huang's former lover Alice Huang, arranged nearly $12 billion in Nvidia chip orders for Chinese companies between 2024 and 2025, according to the WSJ. Short seller Culper Research estimates Nvidia's actual China revenue share exceeds 20 percent, far above the…"},{"id":"https://t3_1xwt3ri","title":"[Статья] Никакого второго прогона: останавливается ли RSI на переднем крае предварительной тренировки? - База 801-30B-A3B скоро появится","link":"https://t3_1xwt3ri","src":"llama","ts":1794741672,"desc":"Предварительное обучение — это то, с чего начинается каждая базовая модель; внедрение рекурсивного самосовершенствования (RSI) позволит ИИ улучшить процесс создания ИИ. Тем не менее, публичная работа RSI до сих пор была нацелена только на постобучение, которое начинается с существующей базовой модели, запускает испытания, требующие часов графического процессора, и возвращает поддающиеся проверке результаты…","lang":"en","cats":[],"title_orig":"[Paper] No Second Run: Does RSI Stop at Frontier Pre-training? - 801-30B-A3B-Base Coming Soon","desc_orig":"Pre-training is where every foundation model begins; bringing recursive self-improvement (RSI) there would let AI improve the process that creates AI. Yet public RSI work has so far targeted only post-training, which starts from an existing base model, runs trials costing GPU-hours, and returns verifiable scores…"},{"id":"https://t.me/denissexy/11798","title":"Пример, почему это плохая идея для крупного бренда использовать сторонний сокращатор ссылок ☕️ потому что теперь там ссылки на все что угодно","link":"https://t.me/denissexy/11798","src":"tg_denis","ts":1794741092,"desc":"","lang":"ru","cats":[]},{"id":"https://t3_1xwsrp1","title":"Установка имплантата в мозг ИИ с помощью Lazarus: анатомия трояна","link":"https://t3_1xwsrp1","src":"llama","ts":1794740469,"desc":"привет, недавно я был немного очарован Lazarus от Microsoft (хотя это, вероятно, старая техника), и я написал сообщение в блоге, показывающее мыслительный процесс, который у меня был во время его исследования - возможно, это кому-нибудь будет полезно https://int8.io/implanting-ai-with-lazarus/…","lang":"en","cats":[],"title_orig":"Placing an implant into AI brain with Lazarus: Anatomy of a trojan","desc_orig":"hello there, I recently got a bit fascinated about Lazarus from Microsoft (even tho it is probably old technique) and I wrote a blog post showing a thought process I had while researching it - maybe it is helpful to anyone https://int8.io/implanting-ai-with-lazarus/…"},{"id":"https://habr.com/ru/articles/1108016/","title":"Ускоряем AI модель на процессоре Qwen3.8-Flash-Next Gyro","link":"https://habr.com/ru/articles/1108016/","src":"habr","ts":1794740250,"desc":"Существует много различных проектов и вариантов по ускорению генерации AI. Но в большинстве случаев они используют тюнинг модели, а так же использование внешней видео карты. Но можно ли ускорить генерацию модели, если у нас есть только процессор и ОЗУ? Для тестирования использовалась модель Qwen3.8-Flash-Next Gyro…","lang":"ru","cats":["llm","vibecoding","cpu"]},{"id":"https://the-decoder.com/australias-central-bank-finds-ai-hitting-young-workers-first-especially-in-software-and-customer-service/","title":"Центральный банк Австралии считает, что ИИ в первую очередь поражает молодых работников, особенно в сфере программного обеспечения и обслуживания клиентов","link":"https://the-decoder.com/australias-central-bank-finds-ai-hitting-young-workers-first-especially-in-software-and-customer-service/","src":"decoder","ts":1794739558,"desc":"Центральный банк Австралии видит первые признаки того, что ИИ поражает молодых работников начального уровня в таких высокозащищенных профессиях, как разработка программного обеспечения и обслуживание клиентов. С момента запуска ChatGPT количество объявлений о вакансиях и занятость среди молодых людей в возрасте от 15 до 24 лет в этих областях сократились более резко, чем среди работников старшего возраста. Автор Майк…","lang":"en","cats":["AI and society","Artificial Intelligence","Short News"],"title_orig":"Australia's central bank finds AI hitting young workers first, especially in software and customer service","desc_orig":"Australia's central bank sees early signs that AI is hittin Cloudflare","Kitesurf","ai-агенты"]},{"id":"https://t3_1xwqvd2","title":"Лучший (и лучший от AMD) компьютер, который у меня когда-либо был.","link":"https://t3_1xwqvd2","src":"llama","ts":1794733252,"desc":"Новая сборка с платой EPYC 7443/Tyan S8030 и R9700 + 7900 XT. Должен был продать 7900 XT, чтобы заплатить за R9700, но этого почему-то не произошло.","lang":"en","cats":[],"title_orig":"The best (and AMD-est) computer I've ever owned","desc_orig":"New build with a EPYC 7443 / Tyan S8030 board, and R9700 + 7900 XT. Was supposed to be selling the 7900 XT to pay for the R9700, but that somehow didn't happen"},{"id":"https://habr.com/ru/articles/1107990/","title":"Нейросеть как соавтор","link":"https://habr.com/ru/articles/1107990/","src":"habr","ts":1794733044,"desc":"Как относиться к тому КАК нейросети пишут тексты, я думаю, все давно определились - это очень плохо, но что на счёт смыслов и знаний? Читать далее","lang":"ru","cats":["этика","humanfirstissue","нейрослоп"]},{"id":"https://habr.com/ru/companies/selectel/articles/1107570/","title":"Монтируем LLM как жесткий диск. Бесконечная файловая система на Python + FUSE","link":"https://habr.com/ru/companies/selectel/articles/1107570/","src":"habr","ts":1794729651,"desc":"Ни для кого не секрет, что языковые модели врут, и врут очень убедительно, часто даже с подробностями. Еще год назад если бы вы попросили у LLM ссылку на исследование, то получили бы статью, которую никто не писал. Спросили бы про метод библиотеки, и модель расписала бы его аргументы, хотя такого метода там не было. С…","lang":"ru","cats":["LLM","FUSE","honeypot"]},{"id":"https://t3_1xwpenj","title":"Клод написал и обучил языковую модель для DOS, которая умещается на дискете.","link":"https://t3_1xwpenj","src":"r_claude","ts":1794727680,"desc":"Я позволил Fable 5.2 написать собственный преобразователь. Опус 5.5 сгенерировал обучающие данные: около 3500 фактов (и светская беседа + математика), каждый задавал и отвечал по-разному. Он имеет 367 тысяч simonwillison.net/2026/Nov/14/datasette-llm/","src":"simon","ts":1794700768,"desc":"Выпуск: datasette-llm 0.1a11 datasette-llm — это промежуточный плагин для Datasette, который поддерживает настройку LLM для использования с другими плагинами Datasette. В этом выпуске добавлена поддержка конечных точек, совместимых с OpenAI, поэтому вы можете настроить Datasette для использования LLM, размещенного где угодно, где используется псевдостандарт OpenAI в сети…","lang":"en","cats":[],"title_orig":"datasette-llm 0.1a11","desc_orig":"Release: datasette-llm 0.1a11 datasette-llm is the intermediate plugin for Datasette that supports configuring LLMs for use with other Datasette plugins. This release adds support for OpenAI-compatible endpoints, so you can configure Datasette to use an LLM hosted anywhere that talks the OpenAI pseudo-standard web…"},{"id":"https://t3_1xwguid","title":"Anthropic открыла доступ к Клоду Мифосу публике.","link":"https://t3_1xwguid","src":"r_claude","ts":1794700012,"desc":"Я только что заметил, что почти каждый может получить доступ через KYC. Раньше для регистрации требовалась проверка CVE или бизнес-подтверждения, но теперь отдельные исследователи могут подать заявку, указав только свое удостоверение личности. Для тех, кто хочет подать заявку: Имейте действующую подписку Claude или учетную запись API. Перейдите на http://portal.anthropic.com и выберите «Cyber…","lang":"en","cats":[],"title_orig":"Anthropic has opened up Claude Mythos access to the public.","desc_orig":"I just noticed pretty much anyone can get access now through KYC. Enrolling used to require CVE or business verification but now individual researchers can apply with just their ID. To those who want to apply: Have an existing Claude subscription or an API account Go to http://portal.anthropic.com and pick \"Cyber…"},{"id":"https://t3_1xwgiow","title":"LFM2.5-24B-A2B+Гермес это круто!","link":"https://t3_1xwgiow","src":"llama","ts":1794699087,"desc":"Я просто хотел поделиться своей любовью к модели, которая, похоже, не очень популярна: LFM2.5-24B-A2B! ( https://huggingface.co/LiquidAI/LFM2.5-24B-A2B-GGUF ) LFM2.5-24B-A2B, похоже, единственная модель, которая обеспечивает отличный баланс между скоростью и возможностями стандартного оборудования. Просто чтобы не путать: это НЕ…","lang":"en","cats":[],"title_orig":"LFM2.5-24B-A2B + Hermes is awesome!","desc_orig":"I just wanted to share some love for a model that doesn't seem to get very much: LFM2.5-24B-A2B! ( https://huggingface.co/LiquidAI/LFM2.5-24B-A2B-GGUF ) LFM2.5-24B-A2B seems to be the only model that strikes a great balance between speed and capability on commodity hardware. Just to get it out of the way: This is NOT…"},{"id":"https://t3_1xwgbxr","title":"Я сделал мод для Майнкрафта с Клодом: нажмите B и весь мир превратится в игрушечные кирпичи.","link":"https://t3_1xwgbxr","src":"r_claude","ts":1794698568,"desc":"Нажмите B, и все вокруг вас превратится в кубики в стиле LEGO, блок за блоком. Ударьте моба, и он развалится на куски, взорвите дом тротилом, и он разлетится на кирпичи, затем зажмите R, и все снова соберется. Скачать бесплатно (Fabric, Minecraft 26.3, пока только одиночная игра)…","lang":"en","cats":[],"title_orig":"I made a Minecraft mod with Claude: press B and the whole world turns into toy bricks","desc_orig":"Press B and everything around you turns into LEGO-style bricks, block by block. Hit a mob and it falls apart into pieces, blow up a house with TNT and it bursts into bricks, then hold R and it all snaps back together. Free to download (Fabric, Minecraft 26.3, singleplayer only for now)…"},{"id":"https://t3_1xwfxy6","title":"Я давал 5 моделям одну и ту же подсказку из одного абзаца каждый день в течение 3 недель и публиковал все, что возвращалось (в основном неотредактированное). Спустя 80 приложений каждая модель имеет очень очевидную индивидуальность.","link":"https://t3_1xwfxy6","src":"r_claude","ts":1794697508,"desc":"Запланированное приглашение одно и то же каждый день: вы участвуете в соревновании по программированию, пишете один самостоятельный HTML-файл, без библиотек, без сети, вы выбираете, что создавать, и он не может повторить ничего, что вы создали раньше. Никаких последующих действий, никаких исправлений. Все, что возвращается, публикуется, но в некоторых случаях я просил добавить немного атмосферы…","lang":"en","cats":[],"title_orig":"I gave 5 models the same one-paragraph prompt every day for 3 weeks and published whatever came back (mostly unedited). 80 apps later, each model has a very obvious personality.","desc_orig":"The scheduled prompt is the same every day: you’re in a coding contest, write one self-contained HTML file, no libraries, no network, you pick what to build, and it can’t repeat anything you’ve built before. No follow-ups, no fixes. Whatever comes back gets published but in a few cases I asked for some added vibe…"},{"id":"https://t3_1xwftge","title":"Если не считать кодирования и прочего, всегда ли Клод наркоман/неудачник?","link":"https://t3_1xwftge","src":"r_claude","ts":1794697179,"desc":"отправлено /u/jhb5 [ссылка] [комментарии]","lang":"en","cats":[],"title_orig":"Outside of coding and such, is Claude always a narc / loser?","desc_orig":"submitted by /u/jhb5 [link] [comments]"},{"id":"https://habr.com/ru/articles/1107946/","title":"Почему с ИИ мы всё ещё пишем плохой софт","link":"https://habr.com/ru/articles/1107946/","src":"habr","ts":1794696146,"desc":"ИИ помогает искать баги и делать рефакторинг. Но к пятнице снова нужна новая фича, а разбор старого кода откладывают. После стрима про качество кода я решил разобраться, почему мы так используем болванчика. В расследовании главное не выйти на самого себя — с этим у нас, кажется, есть проблемы. Читать далее","lang":"ru","cats":["искусственный интеллект","ИИ-агенты","качество кода"]},{"id":"https://t3_1xwf8bb","title":"Наконец-то меня осенило: будущее за локальным ИИ, а не за облачным ИИ","link":"https://t3_1xwf8bb","src":"llama","ts":179 const LS_READ = 'airadar.read.v1', LS_SAVED = 'airadar.saved.v1', LS_SEEN = 'airadar.seen.v1';
const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d } catch(e){ return d } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)) } catch(e){} };

let readSet  = new Set(load(LS_READ, []));
let savedSet = new Set(load(LS_SAVED, []));

/* ── «новое»: id, которых не было в прошлый визит ── */

const freshIds = new Set(DATA.filter(i => !seenSet.has(i.id)).map(i => i.id));
DATA.forEach(i => seenSet.add(i.id));
save(LS_SEEN, [...seenSet]);
const isFresh = id => !firstRun && freshIds.has(id) && !readSet.has(id);

/* ── helpers ── */
function ago(ts){
  if(!ts) return 'без даты';
  const s = Math.floor((Date.now() - ts)/1000);
  if(s < 60) return 'только что';
  if(s < 3600) return Math.floor(s/60) + ' мин';
  if(s < 86400) return Math.floor(s/3600) + ' ч';
  if(s < 86400*7) return Math.floor(s/86400) + ' дн';
  const d = new Date(ts);
  return d.toLocaleDateString('ru-RU', {day:'numeric', month:'short'});
}
function esc(s){ return (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])) }

let toastT;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove('show'), 1900);
}

function buildChips(){
  const box = document.getElementById('chips');
  const mk = (key, label, color, n) =>
    `<button class="chip${filter===key?' on':''}" data-f="${key}">
       ${color?`<span class="dot" style="background:${color}"></span>`:''}${esc(label)}
       <span class="n">${n}</span></button>`;
  let h = mk('all', 'Всё', '', DATA.length);
  Object.entries(SOURCES).forEach(([k, s]) => { if(counts[k]) h += mk(k, s.name, s.color, counts[k]); });
  box.innerHTML = h;
  box.querySelectorAll('.chip').forEach(c => c.onclick = () => {
    filter = c.dataset.f; buildChips(); render();
  });
}

/* ── render ── */
function visible(){
  const q = query.trim().toLowerCase();
  return ORDERED.filter(it => {
    if(filter === 'saved'){ if(!savedSet.has(it.id)) return false; }
    else if(filter === 'unread'){ if(readSet.has(it.id)) return false; }
    else if(filter === 'ru'){ if(it.lang !== 'ru') return false; }
    else if(filter !== 'all'){ if(it.src !== filter) return false; }
    if(q && ![it.title, it.desc, it.title_orig, it.desc_orig].some(t => (t||'').toLowerCase().includes(q))) return false;
    return true;
  });
}

/* Не даём одному источнику занять весь верх: после сортировки по времени
   разбавляем «лесенку» — не больше 2 подряд из одного источника в первых 40 */
function interleave(arr, windowSize = 6, maxRun = 2){
  const out = [], rest = arr.slice();
  let runSrc = null, runLen = 0;
  while (rest.length) {
    let idx = 0;
    if (runLen >= maxRun) {
      const alt = rest.findIndex((x, i) => x.src !== runSrc && i < windowSize);
      if (alt > -1) idx = alt;
    }
    const [pick] = rest.splice(idx, 1);
    runSrc = pick.src === runSrc ? runSrc : pick.src;
    runLen = pick.src === runSrc ? runLen + 1 : 1;
    if (pick.src !== runSrc) runLen = 1;
    out.push(pick);
  }
  return out;
}
const ORDERED = interleave(DATA.slice().sort((a, b) => b._t - a._t));

function render(){
  const list = document.getElementById('list');
  const items = visible();
  const unread = DATA.filter(i => !readSet.has(i.id)).length;
  document.getElementById('stat').textContent =
    `${DATA.length} материалов · ${Object.keys(SOURCES).filter(k=>counts[k]).length} источников · ${unread} новых`;

  if(!items.length){
    list.innerHTML = `<div class="empty">Ничего не найдено.<br>Попробуй другой фильтр или запрос.</div>`;
    return;
  }
  list.innerHTML = items.map(it => {
    const s = SOURCES[it.src] || {name:it.src, color:'#777'};
    const tags = (it.cats||[]).slice(0,3).map(c=>`<span class="tag">${esc(c)}</span>`).join('');
    return `<a class="card${readSet.has(it.id)?' read':''}" href="${esc(it.link)}" target="_blank"
              rel="noopener" data-id="${esc(it.id)}" style="--c:${s.color}">
      <div class="bar"></div>
      <div class="top">
        <span class="src">${esc(s.name)}</span>
        ${isFresh(it.id)?'<span class="new-badge">new</span>':''}
        ${savedSet.has(it.id)?'<span style="color:var(--warn);font-size:12px">★</span>':''}
        <span class="time">${ago(it._t)}</span>
      </div>
      <h3>${esc(it.title)}</h3>
      ${it.desc?`<p>${esc(it.desc)}</p>`:''}
      ${tags?`<div class="tags">${tags}</div>`:''}
    </a>`;
  }).join('');

  list.querySelectorAll('.card').forEach(card => {
    card.addEventListener('click', () => {
      readSet.add(card.dataset.id);
      save(LS_READ, [...readSet]);
      card.classList.add('read');
      card.querySelector('.new-badge')?.remove();
      setTimeout(render, 350);
    });
    /* долгий тап = в избранное */
    let lt;
    card.addEventListener('touchstart', () => {
      lt = setTimeout(() => {
        const id = card.dataset.id;
        if(savedSet.has(id)) savedSet.delete(id); else savedSet.add(id);
        save(LS_SAVED, [...savedSet]);
        toast(savedSet.has(id) ? '★ Добавлено в избранное' : 'Убрано из избранного');
        navigator.vibrate?.(18);
        render();
      }, 480);
    }, {passive:true});
    ['touchend','touchmove','touchcancel'].forEach(ev =>
      card.addEventListener(ev, () => clearTimeout(lt), {passive:true}));
    card.addEventListener('contextmenu', e => e.preventDefault());
  });
}

/* ── автообновление: одна перезагрузка на версию, без циклов ─────────────────
   1. сравниваем свою дату сборки с version.json на сервере (cache: no-store)
   2. если на сервере новее и мы за эту версию ещё не перезагружались — reload
   3. если после reload всё равно старая (CDN отдаёт кэш) — показываем кнопку
   Состояние живёт в sessionStorage: закрыл вкладку → счётчик сбросился.        */
if(location.protocol.startsWith('http')){
  const K = 'airadar.autoreload';
  const st = (() => { try { return JSON.parse(sessionStorage.getItem(K)) || {} } catch(e){ return {} } })();
  const stamp = v => new Date(v).toLocaleString('ru-RU',
    {day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});

  fetch('version.json?t=' + Date.now(), {cache:'no-store'})
    .then(r => r.ok ? r.json() : null)
    .then(v => {
      if(!v || !v.generated) return;
      const serverDate = new Date(v.generated);
      if(serverDate <= buildDate) {           // мы уже на свежей версии
        try { sessionStorage.removeItem(K) } catch(e){}
        return;
      }
      // на сервере новее
      if(st.for !== v.generated && !st.done){
        try {
          sessionStorage.setItem(K, JSON.stringify({for: v.generated, done: true}));
        } catch(e){}
        document.documentElement.style.opacity = '.6';   // мягкий переход
        location.reload();
        return;
      }
      // перезагрузились, но сервер всё ещё отдаёт кэш → предлагаем кнопку
      banner(`🔄 <span><b>Есть свежая версия</b> (${stamp(v.generated)}).</span>
        <button onclick="location.reload()">Обновить</button>`, 'blue');
    })
    .catch(() => {});
}

/* обновились с открытой вкладкой — раз в сессию подхватываем новую версию */
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible' && navigator.onLine &&
     location.protocol.startsWith('http')){
    fetch('version.json?t=' + Date.now(), {cache:'no-store'})
      .then(r => r.ok ? r.json() : null)
      .then(v => {
        if(v?.generated && new Date(v.generated) > buildDate){
          let st = {};
          try { st = JSON.parse(sessionStorage.getItem('airadar.autoreload')) || {} } catch(e){}
          if(st.for !== v.generated){ location.reload(); }
        }
      })
      .catch(() => {});
  }
});
buildChips(); render();

/* PWA: тихая регистрация service worker */
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
