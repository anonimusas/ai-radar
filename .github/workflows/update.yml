name: Обновить AI Radar

on:
  schedule:
    - cron: "17 4,9,14,19 * * *"   # 06:17, 11:17, 16:17, 21:17 по Вильнюсу
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: airadar
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Собрать дашборд
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python build.py
      - name: Закоммитить свежие данные
        run: |
          git config user.name  "ai-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --staged --quiet && exit 0
          git commit -m "data: обновление $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase -X theirs origin main
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
